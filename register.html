<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>New Patient Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column like a clinic clipboard; fieldsets as sheets; a sticky action bar at the foot. */
:root {
  --bg: #F2F4F3;
  --surface: #FFFFFF;
  --ink: #13302D;
  --muted: #4F6662;
  --line: #D5DDDB;
  --accent: #1E6B72;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3EFEF;
  --ochre: #B7832F;
  --risk: #B4533A;
  --plate: #FFFFFF;
  --font-display: "Amiri", "Times New Roman", serif;
  --font-body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  /* PDF sheet: always printed on white, independent of the viewer's theme */
  --sheet-bg: #FFFFFF; --sheet-ink: #13302D; --sheet-muted: #4F6662; --sheet-line: #D5DDDB; --sheet-accent: #1E6B72; --sheet-band: #EEF4F3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1A19; --surface: #162523; --ink: #E3ECEA; --muted: #A3B6B2; --line: #2A3D3A;
    --accent: #5FB3BA; --accent-ink: #0F1A19; --accent-soft: #1C3634; --ochre: #D7A65A; --risk: #E08A6F; --plate: #FFFFFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1A19; --surface: #162523; --ink: #E3ECEA; --muted: #A3B6B2; --line: #2A3D3A;
  --accent: #5FB3BA; --accent-ink: #0F1A19; --accent-soft: #1C3634; --ochre: #D7A65A; --risk: #E08A6F; --plate: #FFFFFF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }
[hidden] { display: none !important; }
.hp { position: absolute; top: 0; inset-inline-start: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); opacity: 0; pointer-events: none; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 680px; margin: 0 auto; padding-block: 24px 120px; display: grid; gap: 20px; }
header.top { display: grid; gap: 14px; }
.toprow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.plate { background: var(--plate); border-radius: 10px; padding: 8px 12px; display: inline-flex; border: 1px solid var(--line); }
.plate img { height: 52px; width: auto; display: block; }
.langbtn {
  font: 500 14px/1 var(--font-body); color: var(--accent); background: transparent;
  border: 1px solid var(--accent); border-radius: 999px; padding: 9px 16px; cursor: pointer;
}
.langbtn:hover { background: var(--accent-soft); }
.eyebrow { color: var(--ochre); font-size: 14px; font-weight: 500; margin: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 6vw, 38px); line-height: 1.25; margin: 0; text-wrap: balance; }
[lang="en"] h1 { font-family: var(--font-body); font-weight: 600; letter-spacing: -0.01em; }
.lede { color: var(--muted); margin: 0; max-width: 60ch; }
.privacy { font-size: 14px; color: var(--muted); border-inline-start: 3px solid var(--ochre); padding-inline-start: 12px; margin: 0; }

fieldset { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 18px 18px 20px; margin: 0; display: grid; gap: 16px; min-width: 0; }
legend { font-family: var(--font-display); font-weight: 700; font-size: 21px; padding: 0 6px; }
[lang="en"] legend { font-family: var(--font-body); font-weight: 600; font-size: 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
.field { display: grid; gap: 6px; min-width: 0; }
label.lbl, .lbl { font-weight: 500; font-size: 15px; }
.req::after { content: " *"; color: var(--risk); }
.hint { font-size: 13px; color: var(--muted); }
input[type="text"], input[type="tel"], input[type="email"], input[type="date"], select, textarea {
  width: 100%; font: 400 16px/1.4 var(--font-body); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; text-align: start;
}
textarea { min-height: 88px; resize: vertical; }
.formerr { display: none; background: var(--surface); border: 1px solid var(--risk); color: var(--risk); border-radius: 10px; padding: 12px 14px; font-weight: 500; }
.formerr.show { display: block; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, .chip input:focus-visible + span {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.ltr { direction: ltr; }
[dir="rtl"] .ltr { text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span {
  display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px;
  font-size: 15px; background: var(--bg); cursor: pointer; user-select: none;
}
.chip input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.err { color: var(--risk); font-size: 13px; }
.invalid input[type], .invalid select, .invalid textarea { border-color: var(--risk); }
.invalid .chip span { border-color: var(--risk); }

.bar {
  position: fixed; inset: auto 0 0 0; background: var(--surface); border-top: 1px solid var(--line);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar .in { max-width: 680px; margin: 0 auto; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.btn {
  font: 600 16px/1 var(--font-body); border-radius: 10px; padding: 14px 20px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn[disabled] { opacity: .6; cursor: progress; }
.status { font-size: 14px; color: var(--muted); }

.done { background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 20px; display: grid; gap: 14px; }
.done h2 { font-family: var(--font-display); font-size: 26px; margin: 0; }
[lang="en"] .done h2 { font-family: var(--font-body); font-size: 21px; }
.done p { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.num { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.num b { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; user-select: all; }
.linkbtn { background: none; border: none; color: var(--accent); font: 500 14px var(--font-body); cursor: pointer; padding: 4px; }
a { color: var(--accent); }


@media (prefers-reduced-motion: no-preference) { .btn, .chip span, .langbtn { transition: background-color .15s, color .15s; } }
</style>
</head>

    const pages = doc.getNumberOfPages();
    for (let i = 1; i <= pages; i++) {
      doc.setPage(i);
      doc.setDrawColor.apply(doc, LINE); doc.setLineWidth(0.2); doc.line(L, 286, R, 286);
      doc.setFont("plex"); doc.setFontSize(8.5); doc.setTextColor.apply(doc, MUTED);
      put(d.sh_addr, start, 291, startAlign);
      if (pages > 1) put(i + " / " + pages, end, 291, endAlign);
    }
    return doc.output("blob");
  }
  async function makePdf() {
    const o = validate(); if (!o) return;
    const btn = $("makeBtn"); btn.disabled = true;
    $("barStatus").dataset.busy = "1"; $("barStatus").textContent = T[lang].making;
    try {
      pdfBlob = null; pdfName = "";
      try {
        pdfBlob = await buildPdf(o);
        const base = (o.nameEn || "").trim().replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "");
        pdfName = "Registration_" + (base ? base + "_" : "") + new Date().toISOString().slice(0, 10) + ".pdf";
      } catch (e) { pdfBlob = null; pdfName = ""; }
      const ok = await submitToClinic(o);
      logEvent(ok ? "sent" : "sendfail", { pdf: pdfBlob ? 1 : 0 });
      if (ok) clearDraft();
      showDone(ok);
    } catch (e) {
      $("barStatus").textContent = (lang === "ar" ? "تعذّر الإرسال. حاول مرة أخرى." : "The form could not be sent. Please try again.");
    } finally {
      btn.disabled = false; delete $("barStatus").dataset.busy;
    }
  }
  function blobToB64(b) {
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = rej; r.readAsDataURL(b); });
  }
  function summaryRows(o) {
    const a = T.ar; const val = (x) => (x && String(x).trim()) || "-";
    const reasons = (o.reasons || []).map((r) => a["r_" + r] + (r === "other" && o.reasonOther ? " (" + o.reasonOther.trim() + ")" : "")).join("، ");
    const age = ageFrom(o.dob);
    return [
      [a.nameAr, val(o.nameAr)], [a.nameEn, val(o.nameEn)],
      [a.dob, fmtDate(o.dob) + (age !== "" ? " (" + age + " " + a.sh_years + ")" : "")],
      [a.sex, o.sex ? a[o.sex] : "-"], [a.natId, val(o.natId)], [a.nationality, val(o.nationality)], [a.occupation, val(o.occupation)],
      [a.mobile, val(o.mobile)], [a.mobile2, val(o.mobile2)], [a.email, val(o.email)], [a.area, val(o.area)],
      [a.reasons, reasons || "-"], [a.referrer, val(o.referrer)],
      [a.meds, val(o.meds)], [a.allergies, val(o.allergies)],
      ["لغة التعبئة", lang === "ar" ? "العربية" : "English"]
    ];
  }
  async function submitToClinic(o) {
    try {
      const pdf = pdfBlob ? await blobToB64(pdfBlob) : "";
      const r = await fetch("/api/register", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ name: o.nameAr, mobile: o.mobile, rows: summaryRows(o), pdf: pdf, filename: pdfName, website: $("website").value, elapsed: Date.now() - loadedAt })
      });
      if (!r.ok) return false;
      const j = await r.json().catch(() => ({}));
      return !!j.ok;
    } catch (e) { return false; }
  }
  function showDone(ok) {
    form.hidden = true; $("bar").hidden = true; $("done").hidden = false; $("doneStatus").textContent = "";
    document.querySelector("#done h2").setAttribute("data-t", ok ? "doneTitle" : "failTitle");
    document.querySelector("#done h2 + p").setAttribute("data-t", ok ? "doneText" : "failText");
    $("saveBtn").hidden = !pdfBlob;
    $("saveBtn").classList.toggle("ghost", ok);
    $("editBtn").hidden = ok;
    applyLang(); window.scrollTo(0, 0);
  }
  $("makeBtn").addEventListener("click", makePdf);
  form.addEventListener("submit", (e) => { e.preventDefault(); makePdf(); });

  async function savePdf() {
    if (!pdfBlob) return;
    const st = $("doneStatus");
    try {
      if (window.claude && window.claude.use) {
        const dl = await window.claude.use("downloads");
        if (dl) { await dl.save({ filename: pdfName, data: pdfBlob }); st.textContent = T[lang].saved; return; }
      }
    } catch (e) { if (e && e.code === "declined") return; }
    try {
      const url = URL.createObjectURL(pdfBlob); const a = document.createElement("a");
      a.href = url; a.download = pdfName; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      st.textContent = T[lang].saved;
    } catch (e) { st.textContent = T[lang].saveFail; }
  }
  $("saveBtn").addEventListener("click", savePdf);

  $("editBtn").addEventListener("click", () => {
    $("done").hidden = true; form.hidden = false; $("bar").hidden = false; saveDraft();
  });

  fillDobOptions(); loadDraft(); applyLang(); syncConditional();
})();
</script>
